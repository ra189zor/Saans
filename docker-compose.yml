# One command:  docker compose up -d
#
# Brings up a single container serving both the API and the page on one port,
# isolated from whatever else is running on the host.
#
# Before the first run:  cp .env.example .env  and put your Groq key in it.
# Compose reads that file below and will refuse to start without it.

services:
  saans:
    build: .
    image: saans:latest
    container_name: saans

    # Host port is configurable because this box runs other things. Change it
    # in .env with SAANS_PORT=..., not here.
    ports:
      - "${SAANS_PORT:-8042}:8000"

    # Weights, the handbook index, and the encoder and reranker that download
    # themselves on first use. Kept outside the image so it stays small and so
    # the ~170 MB of downloaded models survive a rebuild.
    volumes:
      - ./backend/models:/app/backend/models
      # Consented captures. A volume so they survive a rebuild, and so they are
      # somewhere you can see, back up and delete rather than inside a
      # container. Empty unless SAANS_COLLECT=1.
      - ./backend/data:/app/backend/data

    env_file:
      - .env

    environment:
      # 1 forces the X-ray stand-in even when the weights are present.
      SAANS_DEMO_MODE: "${SAANS_DEMO_MODE:-0}"
      # 0 turns off cross-encoder reranking and falls back to vector order.
      SAANS_RERANK: "${SAANS_RERANK:-1}"
      # 1 keeps captures the carer consented to. Off unless asked for, so a
      # deployment cannot start storing children's data by accident.
      SAANS_COLLECT: "${SAANS_COLLECT:-0}"

    # TensorFlow settles around 2 GB. The ceiling is what stops a bad day here
    # from starving the neighbours on a shared box.
    mem_limit: 4g

    restart: unless-stopped

    # start_period is generous on purpose: the first request loads TensorFlow
    # and may download the encoder and reranker.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s

  # A public HTTPS address, for putting the app on someone else's phone.
  #
  # Opt-in, because the app does not need it to run:
  #     docker compose --profile tunnel up -d
  #     docker compose logs tunnel | grep trycloudflare.com
  #
  # HTTPS is the point, not reachability. Port forwarding already makes the
  # server reachable, but a browser will not register a service worker or offer
  # "Add to Home Screen" over plain http, so an installable app needs a
  # certificate. This borrows Cloudflare's.
  #
  # The connection is outbound, so nothing new is exposed on the router and it
  # works behind CGNAT. It reaches the container over the compose network, so
  # no host port is involved and SAANS_PORT does not affect it.
  #
  # One rule: the address is issued per run and changes whenever this restarts.
  # Start it, take the address, and leave it alone until the demo is over.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: saans-tunnel
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://saans:8000
    depends_on:
      - saans
    restart: unless-stopped
